<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagamentos · Fim de ano</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#6b7280;--bd:#e3e6ea;--ok:#16a34a;--okbg:#e8f7ee;--ac:#2563eb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b22;--tx:#eef0f3;--mut:#9aa1ad;--bd:#2a2f39;--ok:#4ade80;--okbg:#14301f;--ac:#60a5fa;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b22;--tx:#eef0f3;--mut:#9aa1ad;--bd:#2a2f39;--ok:#4ade80;--okbg:#14301f;--ac:#60a5fa;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.stat b{display:block;font-size:26px}
.stat span{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:14px}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;cursor:pointer;user-select:none}
li.paid{background:var(--okbg);border-color:var(--ok)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;flex:none;color:#fff;font-size:15px}
li.paid .chk{background:var(--ok);border-color:var(--ok)}
.nm{flex:1;font-size:17px}
li.paid .nm{color:var(--mut);text-decoration:line-through}
.del{border:0;background:none;color:var(--mut);font-size:20px;padding:4px 8px;cursor:pointer}
.add{display:flex;gap:8px;margin-top:16px}
.add input{flex:1;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.add button,.reset{padding:11px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
.reset{background:none;color:var(--mut);border:1px solid var(--bd);margin-top:16px;width:100%;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:24px}
</style>
</head>
<body>
<main>
<h1>Pagamentos · Fim de ano</h1>
<p class="sub">Toque no nome para marcar ou desmarcar.</p>
<div class="stats">
<div class="stat"><b id="np" style="color:var(--ok)">0</b><span>pagaram</span></div>
<div class="stat"><b id="nf">0</b><span>faltam</span></div>
</div>
<div class="bar"><i id="bar"></i></div>
<div class="tabs">
<button data-f="all" class="on">Todos</button>
<button data-f="falta">Faltam</button>
<button data-f="pago">Pagos</button>
</div>
<ul id="list"></ul>
<form class="add" id="addf" onsubmit="return false">
<input id="inp" placeholder="Adicionar pessoa" autocomplete="off">
<button type="submit" id="addb">Adicionar</button>
</form>
<button class="reset" id="reset">Desmarcar todos</button>
</main>
<script>
var KEY="pagamentos-fim-de-ano-v1";
var base=["Ana Julia","Kenia","Adriano","Isabelli","Ana","Livia","Léo","Lucimeire","Carlos","Lavínia","Matheus","Aline","Vinicius","Neila","Letícia","Michele","Daívid","Amanda","Daravaison","Nelson","Joana"];
var data=null,filter="all";
try{var raw=localStorage.getItem(KEY);if(raw)data=JSON.parse(raw)}catch(e){}
if(!Array.isArray(data)){data=base.map(function(n){return{n:n,p:n==="Ana Julia"||n==="Aline"}})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function render(){
var np=data.filter(function(x){return x.p}).length,t=data.length;
document.getElementById("np").textContent=np;
document.getElementById("nf").textContent=t-np;
document.getElementById("bar").style.width=(t?np/t*100:0)+"%";
var ul=document.getElementById("list");ul.innerHTML="";
var shown=0;
data.forEach(function(x,i){
if(filter==="falta"&&x.p)return;if(filter==="pago"&&!x.p)return;
shown++;
var li=document.createElement("li");if(x.p)li.className="paid";
li.innerHTML='<span class="chk">'+(x.p?"✓":"")+'</span><span class="nm"></span><button class="del" title="Remover">×</button>';
li.querySelector(".nm").textContent=x.n;
li.onclick=function(){x.p=!x.p;save();render()};
li.querySelector(".del").onclick=function(e){e.stopPropagation();if(confirm("Remover "+x.n+"?")){data.splice(i,1);save();render()}};
ul.appendChild(li)});
if(!shown){ul.innerHTML='<li class="empty" style="justify-content:center;cursor:default">Ninguém por aqui.</li>'}
}
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){
document.querySelectorAll(".tabs button").forEach(function(o){o.classList.remove("on")});
b.classList.add("on");filter=b.dataset.f;render()}});
function add(){var v=document.getElementById("inp").value.trim();if(!v)return;data.push({n:v,p:false});document.getElementById("inp").value="";save();render()}
document.getElementById("addb").onclick=add;
document.getElementById("inp").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();add()}};
document.getElementById("reset").onclick=function(){if(confirm("Desmarcar todos?")){data.forEach(function(x){x.p=false});save();render()}};
render();
</script>
</body>
</html>
