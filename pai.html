<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>Painel · Para Sempre Pai</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Cache-Control" content="no-store">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --noite:#0E0B08;--ouro:#C8A96E;--ouro-esc:#A8864A;
  --creme:#F5EFE6;--cinza:#8A7B6E;--branco:#FDFAF6;
  --verde:#2D6A4F;--vermelho:#7A2323;
}
body{font-family:'Inter',sans-serif;background:var(--noite);color:var(--creme);min-height:100vh}

/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{
  background:rgba(200,169,110,.05);
  border:1px solid rgba(200,169,110,.15);
  border-radius:20px;padding:40px 28px;
  width:100%;max-width:360px;text-align:center;
}
.login-logo{
  font-family:'Cormorant Garamond',serif;
  font-size:32px;color:var(--ouro);margin-bottom:4px;
}
.login-sub{font-size:11px;color:var(--cinza);letter-spacing:3px;text-transform:uppercase;margin-bottom:32px}
.lbl{font-size:10px;color:var(--ouro);letter-spacing:2px;text-transform:uppercase;display:block;text-align:left;margin:14px 0 5px}
.inp{
  width:100%;padding:13px 14px;
  background:rgba(200,169,110,.04);
  border:1px solid rgba(200,169,110,.2);
  border-radius:10px;font-size:14px;
  font-family:'Inter',sans-serif;color:var(--creme);
  outline:none;transition:.2s;
}
.inp:focus{border-color:var(--ouro)}
.inp::placeholder{color:rgba(200,169,110,.25)}
.btn-login{
  margin-top:20px;width:100%;padding:14px;
  background:linear-gradient(135deg,var(--ouro),var(--ouro-esc));
  color:var(--noite);font-family:'Cormorant Garamond',serif;
  font-size:20px;font-weight:600;border:none;border-radius:12px;cursor:pointer;
}
.login-erro{font-size:12px;color:#e07070;margin-top:12px;min-height:16px}
.login-aviso{font-size:11px;color:rgba(200,169,110,.3);margin-top:14px}

/* PAINEL */
#painelScreen{display:none}
.topo{
  background:rgba(200,169,110,.08);
  border-bottom:1px solid rgba(200,169,110,.12);
  padding:14px 20px;
  display:flex;align-items:center;gap:16px;
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(10px);
}
.topo-logo{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--ouro);flex:1}
.topo-logo small{display:block;font-family:'Inter',sans-serif;font-size:10px;color:var(--cinza);letter-spacing:2px;text-transform:uppercase}
.tab{
  padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;
  cursor:pointer;border:1px solid transparent;color:var(--cinza);transition:.2s;
}
.tab.ativo{background:rgba(200,169,110,.12);border-color:rgba(200,169,110,.3);color:var(--ouro)}
.btn-sair{
  background:none;border:1px solid rgba(200,169,110,.2);
  color:var(--cinza);font-size:12px;font-weight:700;
  padding:7px 12px;border-radius:8px;cursor:pointer;
}

.body{padding:20px;max-width:900px;margin:0 auto}

/* MÉTRICAS */
.mets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
@media(min-width:600px){.mets{grid-template-columns:repeat(4,1fr)}}
.met{
  background:rgba(200,169,110,.05);
  border:1px solid rgba(200,169,110,.1);
  border-radius:14px;padding:16px;
}
.met-ico{font-size:20px;margin-bottom:6px}
.met-val{font-family:'Cormorant Garamond',serif;font-size:30px;color:var(--ouro);line-height:1}
.met-lbl{font-size:10px;color:var(--cinza);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* AÇÕES */
.barra{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filtro{
  flex:1;min-width:180px;
  padding:9px 14px;
  background:rgba(200,169,110,.04);
  border:1px solid rgba(200,169,110,.15);
  border-radius:10px;font-size:13px;
  font-family:'Inter',sans-serif;color:var(--creme);outline:none;
}
.filtro::placeholder{color:rgba(200,169,110,.25)}
.filtro:focus{border-color:var(--ouro)}
.btn-acao{
  padding:9px 14px;border-radius:10px;
  font-size:12px;font-weight:700;border:none;cursor:pointer;transition:.2s;
  background:rgba(200,169,110,.15);color:var(--ouro);
}
.btn-acao:hover{background:rgba(200,169,110,.25)}

/* TABELA */
.tabela-wrap{
  background:rgba(200,169,110,.03);
  border:1px solid rgba(200,169,110,.1);
  border-radius:14px;overflow:hidden;
}
.t-head,.t-row{
  display:grid;
  grid-template-columns:110px 1fr 150px 70px 90px;
  padding:11px 14px;align-items:center;gap:6px;
}
.t-head{
  border-bottom:1px solid rgba(200,169,110,.1);
  font-size:10px;color:var(--cinza);
  text-transform:uppercase;letter-spacing:.5px;font-weight:700;
}
.t-row{
  border-bottom:1px solid rgba(200,169,110,.06);
  font-size:12px;cursor:pointer;transition:.15s;
}
.t-row:hover{background:rgba(200,169,110,.05)}
.t-row:last-child{border-bottom:none}
.t-id{font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--ouro)}
.t-nome{font-weight:700;color:var(--creme)}
.t-contato{font-size:11px;color:var(--cinza);line-height:1.5}
.t-total{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--ouro)}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px}
.badge-ok{background:rgba(45,106,79,.3);color:#5fba8a}
.badge-ag{background:rgba(150,120,50,.2);color:var(--ouro)}
.badge-err{background:rgba(122,35,35,.3);color:#e07070}
.vazio{text-align:center;padding:40px;color:var(--cinza);font-size:13px}

/* MODAL DETALHE */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  z-index:300;display:none;
  align-items:center;justify-content:center;
  padding:20px;backdrop-filter:blur(4px);
}
.overlay.show{display:flex}
.modal{
  background:#16120E;
  border:1px solid rgba(200,169,110,.2);
  border-radius:18px;padding:28px;
  width:100%;max-width:420px;
  max-height:90vh;overflow-y:auto;
}
.modal-titulo{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--ouro);margin-bottom:16px}
.det-linha{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(200,169,110,.08);font-size:13px}
.det-linha:last-child{border:none}
.det-k{color:var(--cinza)}
.det-v{color:var(--creme);font-weight:700;text-align:right;max-width:60%;word-break:break-all}
.modal-acoes{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn-modal{
  flex:1;padding:11px;border:none;border-radius:10px;
  font-family:'Cormorant Garamond',serif;font-size:17px;cursor:pointer;
}
.btn-ok{background:rgba(45,106,79,.4);color:#5fba8a}
.btn-fechar{background:rgba(200,169,110,.1);color:var(--cinza)}

/* TOAST */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(16px);
  background:var(--ouro);color:var(--noite);
  font-family:'Cormorant Garamond',serif;
  font-size:15px;padding:9px 22px;border-radius:100px;
  opacity:0;transition:all .3s;z-index:999;white-space:nowrap;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ABA USUARIOS */
.user-card{
  background:rgba(200,169,110,.04);
  border:1px solid rgba(200,169,110,.1);
  border-radius:12px;padding:14px 16px;
  margin-bottom:10px;
}
.user-nome{font-weight:700;font-size:14px;color:var(--creme);margin-bottom:4px}
.user-info{font-size:12px;color:var(--cinza);line-height:1.6}
.user-compras{
  display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;
}
.user-compra-tag{
  font-size:10px;background:rgba(200,169,110,.1);
  color:var(--ouro);padding:3px 8px;border-radius:100px;
  letter-spacing:.3px;
}
@media(max-width:600px){
  .t-head,.t-row{grid-template-columns:1fr 1fr 60px 70px}
  .t-head :nth-child(1),.t-head :nth-child(3),
  .t-row  :nth-child(1),.t-row  :nth-child(3){display:none}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">🕊️ Para Sempre Pai</div>
    <div class="login-sub">Área restrita</div>
    <label class="lbl">Usuário</label>
    <input class="inp" id="lu" type="text" placeholder="Deyvd" autocomplete="username" onkeydown="if(event.key==='Enter')login()">
    <label class="lbl">Senha</label>
    <input class="inp" id="lp" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <button class="btn-login" onclick="login()">ENTRAR →</button>
    <div class="login-erro" id="loginErro"></div>
    <div class="login-aviso">🔒 Acesso monitorado</div>
  </div>
</div>

<!-- PAINEL -->
<div id="painelScreen">
  <div class="topo">
    <div class="topo-logo">Para Sempre Pai <small>Painel ADM</small></div>
    <div class="tab ativo" onclick="irAba('pedidos',this)">Pedidos</div>
    <div class="tab" onclick="irAba('usuarios',this)">Clientes</div>
    <button class="btn-sair" onclick="sair()">Sair</button>
  </div>

  <div class="body">

    <!-- MÉTRICAS -->
    <div class="mets">
      <div class="met"><div class="met-ico">📦</div><div class="met-val" id="mPed">0</div><div class="met-lbl">Pedidos</div></div>
      <div class="met"><div class="met-ico">💛</div><div class="met-val" id="mRec">R$0</div><div class="met-lbl">Receita</div></div>
      <div class="met"><div class="met-ico">✓</div><div class="met-val" id="mPag">0</div><div class="met-lbl">Aprovados</div></div>
      <div class="met"><div class="met-ico">⏳</div><div class="met-val" id="mAg">0</div><div class="met-lbl">Pendentes</div></div>
    </div>

    <!-- ABA PEDIDOS -->
    <div id="aba-pedidos">
      <div class="barra">
        <input class="filtro" id="filtroP" placeholder="🔍 Nome, e-mail ou ID..." oninput="renderPedidos()">
        <button class="btn-acao" onclick="exportCSV()">⬇ CSV</button>
        <button class="btn-acao" onclick="carregar()">↺</button>
      </div>
      <div class="tabela-wrap">
        <div class="t-head">
          <div>ID</div><div>Cliente</div><div>Contato</div><div>Total</div><div>Status</div>
        </div>
        <div id="tabelaPedidos"></div>
      </div>
    </div>

    <!-- ABA CLIENTES -->
    <div id="aba-usuarios" style="display:none">
      <div class="barra">
        <input class="filtro" id="filtroU" placeholder="🔍 Nome ou e-mail..." oninput="renderUsuarios()">
        <div style="font-size:12px;color:var(--cinza)" id="totalUsers"></div>
      </div>
      <div id="listaUsuarios"></div>
    </div>

  </div>
</div>

<!-- MODAL DETALHE -->
<div class="overlay" id="ovDet" onclick="fecharDet(event)">
  <div class="modal">
    <div class="modal-titulo">Pedido <span id="detId"></span></div>
    <div id="detConteudo"></div>
    <div class="modal-acoes" id="detAcoes"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══ AUTH ══
const CREDS = { user:'Deyvd', hash:'032a2077d0f30a242008089b0eb3c0931cdbd58a06fe8c1f422afd40b4118043' };
const RL_KEY = '_psprl';
let _tok = null;

function rlGet(){ try{return JSON.parse(sessionStorage.getItem(RL_KEY)||'{"n":0,"t":0}')}catch(e){return{n:0,t:0}} }
function rlSet(v){ try{sessionStorage.setItem(RL_KEY,JSON.stringify(v))}catch(e){} }

async function sha256(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function login(){
  const rl = rlGet();
  if(rl.n>=5 && (Date.now()-rl.t)<15*60*1000){
    document.getElementById('loginErro').textContent='🔒 Bloqueado por 15 min.'; return;
  }
  const u = document.getElementById('lu').value.trim();
  const p = document.getElementById('lp').value;
  if(!u||!p){ document.getElementById('loginErro').textContent='Preencha todos os campos.'; return; }
  const h = await sha256(p);
  if(u===CREDS.user && h===CREDS.hash){
    rlSet({n:0,t:0});
    _tok = await sha256(Date.now()+Math.random().toString());
    sessionStorage.setItem('_psps',_tok);
    abrirPainel();
  } else {
    const novo={n:rl.n+1,t:Date.now()}; rlSet(novo);
    const r=Math.max(0,5-novo.n);
    document.getElementById('loginErro').textContent = r>0 ? `Credenciais inválidas. ${r} tentativas restantes.` : '🔒 Bloqueado por 15 min.';
    document.getElementById('lp').value='';
  }
}

function sair(){
  _tok=null; sessionStorage.removeItem('_psps');
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('painelScreen').style.display='none';
  document.getElementById('lp').value='';
  document.getElementById('loginErro').textContent='';
}

function abrirPainel(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('painelScreen').style.display='block';
  carregar();
}

// ══ DADOS (localStorage — mesma chave do site principal) ══
let pedidos=[], usuarios={};

function carregar(){
  try{ pedidos=JSON.parse(localStorage.getItem('psp_pedidos')||'[]'); }catch(e){ pedidos=[]; }
  try{ usuarios=JSON.parse(localStorage.getItem('psp_usuarios')||'{}'); }catch(e){ usuarios={}; }
  atualizarMets();
  renderPedidos();
  renderUsuarios();
}

function atualizarMets(){
  const pag  = pedidos.filter(p=>p.status==='approved');
  const ag   = pedidos.filter(p=>p.status!=='approved'&&p.status!=='rejected');
  const rec  = pag.reduce((s,p)=>s+(p.total||0),0);
  document.getElementById('mPed').textContent = pedidos.length;
  document.getElementById('mRec').textContent = 'R$'+rec.toFixed(0);
  document.getElementById('mPag').textContent = pag.length;
  document.getElementById('mAg').textContent  = ag.length;
}

// ══ PEDIDOS ══
function renderPedidos(){
  const q=(document.getElementById('filtroP').value||'').toLowerCase();
  const lista = q ? pedidos.filter(p=>
    (p.id||'').toLowerCase().includes(q)||
    (p.nomeF||'').toLowerCase().includes(q)||
    (p.nomePai||'').toLowerCase().includes(q)||
    (p.email||'').toLowerCase().includes(q)
  ) : pedidos;

  const el = document.getElementById('tabelaPedidos');
  if(!lista.length){ el.innerHTML=`<div class="vazio">Nenhum pedido ainda</div>`; return; }

  el.innerHTML = lista.map(p=>{
    const dt = p.ts ? new Date(p.ts).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
    const badge = p.status==='approved'
      ? '<span class="badge badge-ok">Pago</span>'
      : p.status==='rejected'
      ? '<span class="badge badge-err">Recusado</span>'
      : '<span class="badge badge-ag">Aguardando</span>';
    const tot = p.total ? 'R$'+p.total.toFixed(2).replace('.',',') : '—';
    return `<div class="t-row" onclick="abrirDet('${esc(p.id||'')}')">
      <div class="t-id">${esc(p.id||'—')}</div>
      <div class="t-nome">${esc(p.nomeF||'—')}</div>
      <div class="t-contato">${esc(p.email||'—')}<br><span style="font-size:10px;color:var(--ouro)">${esc(p.tel||p.telefone||'—')}</span></div>
      <div class="t-total">${tot}</div>
      <div>${badge}</div>
    </div>`;
  }).join('');
}

// ══ CLIENTES ══
function renderUsuarios(){
  const q=(document.getElementById('filtroU').value||'').toLowerCase();
  const todos = Object.entries(usuarios);
  const lista = q ? todos.filter(([e,u])=>
    e.toLowerCase().includes(q)||(u.nome||'').toLowerCase().includes(q)
  ) : todos;

  document.getElementById('totalUsers').textContent = `${lista.length} cliente(s)`;

  const el = document.getElementById('listaUsuarios');
  if(!lista.length){ el.innerHTML=`<div class="vazio">Nenhum cliente ainda</div>`; return; }

  el.innerHTML = lista.map(([email,u])=>{
    const compras = (u.compras||[]);
    const tags = compras.map(c=>
      `<span class="user-compra-tag">${new Date(c.ts).toLocaleDateString('pt-BR')} · R$${(c.total||0).toFixed(2).replace('.',',')}</span>`
    ).join('');
    return `<div class="user-card">
      <div class="user-nome">${esc(u.nome||'—')}</div>
      <div class="user-info">
        ${esc(email)}<br>
        ${u.tel ? esc(u.tel)+'<br>' : ''}
        ${compras.length} compra(s)
      </div>
      ${compras.length ? `<div class="user-compras">${tags}</div>` : ''}
    </div>`;
  }).join('');
}

// ══ DETALHE PEDIDO ══
let pedidoAtual = null;

function abrirDet(id){
  pedidoAtual = pedidos.find(p=>p.id===id);
  if(!pedidoAtual) return;
  const p = pedidoAtual;
  const dt = p.ts ? new Date(p.ts).toLocaleString('pt-BR') : '—';
  const tot = p.total ? 'R$'+p.total.toFixed(2).replace('.',',') : '—';

  document.getElementById('detId').textContent = p.id||'';
  document.getElementById('detConteudo').innerHTML = `
    <div class="det-linha"><span class="det-k">Nome</span><span class="det-v">${esc(p.nomeF||'—')}</span></div>
    <div class="det-linha"><span class="det-k">Pai</span><span class="det-v">${esc(p.nomePai||'—')}</span></div>
    <div class="det-linha"><span class="det-k">E-mail</span><span class="det-v">${esc(p.email||'—')}</span></div>
    <div class="det-linha"><span class="det-k">WhatsApp</span><span class="det-v">${esc(p.tel||p.telefone||'Não informado')}</span></div>
    <div class="det-linha"><span class="det-k">Total</span><span class="det-v">${tot}</span></div>
    <div class="det-linha"><span class="det-k">Data</span><span class="det-v">${dt}</span></div>
    <div class="det-linha"><span class="det-k">Status</span><span class="det-v">${esc(p.status||'—')}</span></div>
    <div class="det-linha"><span class="det-k">Payment ID</span><span class="det-v">${esc(String(p.paymentId||'—'))}</span></div>`;

  const acoes = document.getElementById('detAcoes');
  acoes.innerHTML = '';
  if(p.status!=='approved'){
    const b=document.createElement('button');
    b.className='btn-modal btn-ok'; b.textContent='✓ Marcar como pago';
    b.onclick=()=>marcarPago();
    acoes.appendChild(b);
  }
  const bf=document.createElement('button');
  bf.className='btn-modal btn-fechar'; bf.textContent='Fechar';
  bf.onclick=()=>fecharDet();
  acoes.appendChild(bf);

  document.getElementById('ovDet').classList.add('show');
}

function marcarPago(){
  if(!pedidoAtual) return;
  const idx=pedidos.findIndex(p=>p.id===pedidoAtual.id);
  if(idx<0) return;
  pedidos[idx].status='approved';
  try{ localStorage.setItem('psp_pedidos',JSON.stringify(pedidos)); }catch(e){}
  carregar(); fecharDet();
  toast('✓ Marcado como pago');
}

function fecharDet(e){
  if(!e||e.target.id==='ovDet')
    document.getElementById('ovDet').classList.remove('show');
}

// ══ ABAS ══
function irAba(id,el){
  document.getElementById('aba-pedidos').style.display='none';
  document.getElementById('aba-usuarios').style.display='none';
  document.getElementById('aba-'+id).style.display='block';
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ativo'));
  el.classList.add('ativo');
}

// ══ CSV ══
function exportCSV(){
  if(!pedidos.length){ toast('Nenhum pedido'); return; }
  const head=['ID','Nome','Pai','Email','Total','Data','Status'];
  const rows=pedidos.map(p=>[
    p.id||'',p.nomeF||'',p.nomePai||'',p.email||'',
    p.total?(p.total).toFixed(2):'0',
    p.ts?new Date(p.ts).toLocaleString('pt-BR'):'',
    p.status||''
  ].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','));
  const csv=[head.join(','),...rows].join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));
  a.download='parasemprepai-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  toast('CSV exportado');
}

// ══ HELPERS ══
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2400);
}
